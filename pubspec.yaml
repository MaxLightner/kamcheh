name: sakhtyar
description: Construction network app prototype
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  image_picker: ^1.2.3
  share_plus: ^13.3.1
  pdf: ^3.13.1
  web: ^1.1.1
  file_selector: ^1.1.0
  sembast: ^3.8.5
  sembast_web: ^2.4.2
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
