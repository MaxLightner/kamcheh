name: Kamcheh unified web
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter from official repository
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Generate shared public backend config
        run: node scripts/configure-backend.cjs
      - name: Validate desktop JavaScript
        run: |
          node --check site/assets/config.js
          node --check site/assets/kamcheh.js
          node --check site/assets/demo-data.js
          node site/tests/ui-model.cjs
      - run: flutter pub get
      - run: flutter analyze
      - name: Domain tests
        run: flutter test test/kamcheh_test.dart test/stages_14_17_test.dart test/stages_7_13_test.dart test/structure_test.dart test/package2_test.dart test/package3_test.dart test/squaring_tool_test.dart
      - name: Build existing Flutter web application
        run: flutter build web --dart-define-from-file=config/public_backend.json --base-href "/kamcheh/app/" --no-web-resources-cdn
      - name: Assemble desktop website and app
        run: |
          rm -rf public
          mkdir -p public/app
          cp -a site/. public/
          cp -a build/web/. public/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment